# /etc/caldun-known-issues.conf — known faulty-sensor database for caldun(1).
#
# caldun flags a reading as SUSPECT when one temperature channel on a chip
# disagrees with all the other channels on the same chip (it reads far hotter
# while its siblings stay cool). Such a reading is reported separately and is NOT
# treated as a real thermal alarm. This file lets caldun attach a specific
# defect description and a fix to a suspect reading, by matching the device.
#
# Format: one record per blank-line-separated block of "key: value" lines.
#   device:    REQUIRED. Glob matched (case-insensitively) against the device
#              model string, e.g. "Samsung SSD 980*". Use '*' to match any model.
#   firmware:  OPTIONAL. Glob matched against the device firmware revision; if
#              omitted the record matches every firmware version of the device.
#   defect:    REQUIRED. One-line description of the defect (shown to the user).
#   solution:  OPTIONAL. One-line description of how to fix it (shown to the user).
# Lines starting with '#' are comments. The first matching record wins.
#
# Device model / firmware are currently resolved for NVMe drives (via sysfs);
# other chip types match only the 'device: *' wildcard.

device:   Samsung SSD 980*
firmware: 2B4QFXO7
defect:   Firmware 2B4QFXO7 intermittently reports a phantom ~84°C on the "Composite" (and "Sensor 1") channels while the drive is actually ~65°C. It is a known reporting bug, not real heat — the drive is not overheating.
solution: Update the SSD firmware to 3B4QFXO7 or later. On Linux, use Samsung's bootable "SSD Firmware Update Utility" ISO (samsung.com → SSD → Tools & Software) written to a USB stick; Samsung Magician is Windows-only. Back up the drive first. After updating, the phantom spikes stop.

# The 980 PRO has a separate, well-known firmware defect (5B2QGXA7 and earlier)
# that can brick the drive and is unrelated to temperature, but its temperature
# channel can misbehave similarly on old firmware; flag it generically.
device:   Samsung SSD 980 PRO*
firmware: [0-4]B2QGXA7
defect:   On firmware 5B2QGXA7 and earlier the 980 PRO can report erratic temperatures and (separately) suffers a wear/health firmware bug.
solution: Update to firmware 5B2QGXA7 or later via Samsung Magician (Windows) or Samsung's bootable firmware-update ISO. Back up the drive first.
