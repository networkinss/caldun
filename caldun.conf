# /etc/caldun.conf — configuration for caldun(1).
#
# This file is sourced as POSIX shell by /usr/bin/caldun. Only set
# variables; do not run commands. All settings are optional — anything left
# commented out keeps the built-in default shown beside it.
#
# Thresholds are hybrid. For each sensor:
#   * if the hardware reports a limit (temp*_max / temp*_crit), it is used;
#   * otherwise the per-category default below is used;
#   * when both exist, the LOWER (more conservative) value wins, so a hardware
#     limit can only make an alert fire sooner, never later than the default.
# Run `caldun --check` to see the effective WARN/CRIT per sensor and
# whether each came from "hardware" or "default".

# WARN this many degrees C below the effective CRITICAL value.
#WARN_MARGIN=10

# Per-category fallback thresholds (degrees C), used when the sensor reports
# no hardware limit. CPU and GPU chips usually report none, so these matter.
#CPU_WARN=85;   CPU_CRIT=95
#GPU_WARN=85;   GPU_CRIT=95

# Drives default low on purpose: NVMe hardware limits are often ~100 C, but a
# drive that hot stalls I/O and can freeze the machine. See the README's
# "NVMe thermal incident" note before raising these.
#DRIVE_WARN=75; DRIVE_CRIT=83

# Uncategorised ("Other") sensors added via EXTRA_SENSORS without a category.
# Left blank => such sensors are thresholded ONLY by their hardware limits;
# if they report none, they are shown as report-only ([—], never alert).
#DEFAULT_WARN=""; DEFAULT_CRIT=""

# Force-include sensors the allowlist would skip. Space-separated chip globs,
# each optionally "=CATEGORY" (CPU|GPU|DRIVE|OTHER). Globs match the chip name
# as printed by `sensors -j` (e.g. nct6798-isa-0290).
#   EXTRA_SENSORS="nct6799-* acpitz-*=CPU"
#EXTRA_SENSORS=""

# Force-exclude sensors. Space-separated chip globs. Use this to silence a
# specific noisy sensor. By default the allowlist already excludes Super-I/O
# chips (nct*, it87*, etc.), so you rarely need this.
#   IGNORE_SENSORS="nvme-pci-0200 amdgpu-*"
#IGNORE_SENSORS=""

# Behave as if --notify was always passed (the systemd user service already
# passes --notify, so leave this at 0 unless you call caldun by hand).
#NOTIFY_DEFAULT=0

# Faulty-sensor detection. A real overheat heats every channel on a chip together;
# a buggy sensor makes ONE channel disagree with its siblings. When an alarming
# channel reads more than ANOMALY_MARGIN degrees above every OTHER channel on the
# same chip AND those siblings are all below their WARN threshold, caldun marks
# it SUSPECT: it is reported separately (with any matching known-issue defect/fix)
# instead of raising a false thermal alarm. A genuinely hot part — where the sibling
# channels are also hot — is never masked. Set ANOMALY_DETECT=0 to disable.
# (This is what catches the Samsung 980 firmware bug: a phantom ~84 C Composite
#  reading while the drive's other channels stay ~60 C.)
#ANOMALY_DETECT=1
#ANOMALY_MARGIN=15

# Path to the known-issues database that maps a device to a defect description and
# a solution, shown when a SUSPECT reading is detected. Override with the
# CALDUN_ISSUES environment variable.
#KNOWN_ISSUES_DB=/etc/caldun-known-issues.conf

# Send a desktop notification whenever a suspect sensor reading is detected
# (ANOMALY_DETECT must be 1). Fires independently of --notify/--popup, so random
# spike events are reported even when you run caldun interactively. The
# notification includes the defect description and fix from KNOWN_ISSUES_DB when
# the device is listed there. Set to 0 to suppress these popups entirely.
#NOTIFY_SUSPECT=1

# ---------------------------------------------------------------------------
# CPU clock and fan speeds (new in 1.7)
# ---------------------------------------------------------------------------

# Show the CPU clock alongside the temperatures. Temperature alone does not
# answer the question you actually have during a long compile — "am I losing
# clocks?" — because 85 C at boost is fine while 85 C at 1.4 GHz means the build
# now takes twice as long. The reported figure is the MEAN across cores, not the
# maximum: caldun is itself load on the busiest core, so a maximum would read
# near boost on every sample and tell you nothing.
#
# A percentage is shown only when caldun has a ceiling it trusts. Under
# amd_pstate/intel_pstate that is cpuinfo_max_freq. Under acpi-cpufreq
# cpuinfo_max_freq is only the BASE clock (a Ryzen 7 4800U reports 1.8 GHz while
# boosting to 4.2 GHz, so the naive ratio exceeds 100% at idle) and no boost
# ceiling exists in sysfs, so caldun uses the highest clock it has ever seen on
# this machine — after MIN_FREQ_SAMPLES observations, below which it prints
# absolute GHz only.
#SHOW_CLOCKS=1
#MIN_FREQ_SAMPLES=20

# Show fan speeds when the machine has them. Fans are read only from chips that
# pass the same trust test as temperatures, so the nct6798's fan channels are no
# more trusted here than its bogus CPUTIN reading.
#SHOW_FANS=1

# ---------------------------------------------------------------------------
# Peak tracking (new in 1.7)
# ---------------------------------------------------------------------------

# Record the high-water mark for each sensor, shown by "caldun --peak" and
# summarised when a "caldun --watch" run ends. Every run contributes, including
# the systemd timer's, so the since-boot history is as fine-grained as the timer
# interval. Peaks reset when the machine reboots.
#
# SUSPECT readings are tracked separately and never become a sensor's peak: a
# phantom 84 C spike would otherwise become a permanent high-water mark.
#
# State lives under the user's XDG state directory, not /var, because the
# packaged timer runs as a USER service and must not need root. Override the
# path with the CALDUN_PEAKS environment variable.
#PEAK_TRACK=1
