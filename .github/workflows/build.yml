name: build

on:
  push:
    branches: [ master, develop ]
  pull_request:
  workflow_dispatch:

jobs:
  deb:
    # Mint 21 and Mint 22 — the distributions this package actually targets —
    # are based on these two. The span also covers MATE 1.26 vs 1.28, which is
    # where the applet's factory_main signature and D-Bus activation name matter.
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-22.04, ubuntu-24.04 ]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    # ubuntu-24.04's needrestart defaults to interactive mode, so any apt-get
    # install pulling in a service package pops a whiptail prompt asking which
    # services to restart — with no TTY to answer it, the step hangs until the
    # job timeout instead of failing. ubuntu-22.04 doesn't hit this. Both env
    # vars matter: DEBIAN_FRONTEND silences debconf itself, NEEDRESTART_MODE=a
    # (auto-restart, no prompt) silences needrestart specifically — it reads
    # its own config, not debconf's frontend setting.
    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        # Installed with apt, not cache-apt-pkgs-action: that action restores
        # the package *files* from a cache without registering them in the dpkg
        # status database, so dpkg-checkbuilddeps still reported
        # "Unmet build dependencies: debhelper-compat (= 13)" and aborted the
        # build. Build-Depends resolution needs real dpkg state.
        # build-essential isn't in debian/control's Build-Depends — Debian
        # policy treats it as an implicit baseline every build environment has
        # — but dpkg-checkbuilddeps still hard-checks it's actually installed,
        # and a bare GitHub runner doesn't guarantee it. Without it here:
        # "Unmet build dependencies: build-essential:native".
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts dpkg-dev fakeroot

      - name: Build the .deb
        # build-deb.sh copies the sources into _build/ and cleans up after
        # itself, so it runs unmodified here. Calling it rather than repeating
        # dpkg-buildpackage flags in YAML keeps one source of truth.
        run: ./build-deb.sh

      - name: Verify package contents
        run: |
          set -euo pipefail
          deb=$(ls -t caldun_*.deb | head -1)
          echo "== $deb =="
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" > contents.txt
          cat contents.txt
          # Assert on a file, not through a pipe: `grep -q` exits at the first
          # match and closes the pipe, so dpkg-deb dies of SIGPIPE and pipefail
          # fails the *successful* case.
          # The D-Bus activation name must equal org.mate.panel.applet.<FactoryId>
          # or the panel silently skips the applet at startup. Cheap to assert.
          grep -q 'org.mate.panel.applet.CaldunAppletFactory.service' contents.txt \
            || { echo "D-Bus service file missing or misnamed"; exit 1; }
          # A doc shipped as a symlink to the build tree is broken on install.
          ! grep -q ' -> /home/' contents.txt \
            || { echo "package contains a symlink into the build tree"; exit 1; }

      - name: lintian
        # Blocking: the package is currently lintian-clean, so any new tag is a
        # regression rather than a backlog item.
        run: |
          sudo apt-get install -y lintian
          lintian "$(ls -t caldun_*.deb | head -1)"

      - uses: actions/upload-artifact@v4
        with:
          name: caldun-deb-${{ matrix.runner }}
          path: caldun_*.deb
          if-no-files-found: error

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a
    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: shellcheck
          version: 1.0

      - name: shellcheck
        run: shellcheck caldun.sh build-deb.sh diagnose-applet.sh macos/caldun-macos.sh tests/run.sh

      - name: python syntax
        run: python3 -m py_compile applet/caldun-applet

      - name: man page
        run: |
          sudo apt-get install -y groff-base
          groff -man -Tutf8 -ww man/caldun.1 >/dev/null

  smoke:
    # The fixture test suite (tests/run.sh): argument handling, the exit-code
    # contract, the suspect path, multi-drive --get, watch mode and its
    # notification rate limit. Hermetic: every run reads a fixture
    # (CALDUN_SENSORS_JSON), never the runner's hardware, which may expose a
    # chip caldun trusts (acpitz, coretemp). Needs only jq — not lm-sensors.
    # Job id kept as "smoke" so existing required-check settings still match.
    name: test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: jq
          version: 1.0

      - name: Run tests/run.sh
        run: ./tests/run.sh
